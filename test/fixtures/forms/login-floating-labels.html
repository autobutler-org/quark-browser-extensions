<!-- Material-style login: each label floats over its field, which has a transparent background and a blank
     placeholder so CSS can tell when it is empty. The labels overlap the fields; the fields are real. -->
<style>
  .float { position: relative; width: 280px; height: 56px; }
  .float input { width: 100%; height: 56px; background: transparent; }
  .float label { position: absolute; left: 12px; top: 18px; pointer-events: none; }
</style>
<form method="post" action="/login">
  <div class="float">
    <input type="email" id="email" name="email" placeholder=" " autocomplete="username" data-fx="user">
    <label for="email">Email address</label>
  </div>
  <div class="float">
    <input type="password" id="password" name="password" placeholder=" " autocomplete="current-password" data-fx="pw">
    <label for="password">Password</label>
  </div>
  <button type="submit">Log in</button>
</form>
