<!-- Framework sign-up form from before autocomplete hints were common: username, password, password again. -->
<form method="post" action="/accounts/signup/">
  <p><label for="id_username">Username:</label> <input type="text" name="username" maxlength="150" id="id_username" data-fx="user"></p>
  <p><label for="id_password1">Password:</label> <input type="password" name="password1" id="id_password1" data-fx="pw1"></p>
  <p><label for="id_password2">Password confirmation:</label> <input type="password" name="password2" id="id_password2" data-fx="pw2"></p>
  <input type="submit" value="Sign up">
</form>
