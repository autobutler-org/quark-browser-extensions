<!-- First step of a two-step login with no autocomplete; a newsletter box comes before it on the page. -->
<aside><form id="newsletter-form"><input type="email" name="email" placeholder="you@example.com" data-fx="newsletter"></form></aside>
<form action="/login/start" method="post">
  <label for="username">Username or email</label>
  <input type="text" id="username" name="username" data-fx="user">
  <button type="submit">Continue</button>
</form>
