<!-- Names and autocomplete disagree; autocomplete wins each time. -->
<form action="/account" method="post">
  <input type="text" name="username" autocomplete="nickname" placeholder="Display name" data-fx="display">
  <input type="text" name="login_email" autocomplete="username" data-fx="user">
  <input type="tel" name="mfa_phone" autocomplete="tel" placeholder="Phone for 2FA texts" data-fx="phone">
  <input type="password" name="current_password" autocomplete="new-password" data-fx="pw">
  <input type="password" name="password_again" data-fx="confirm">
  <button type="submit">Save</button>
</form>
