<!-- Account edit form that asks for the current password last, with no autocomplete hints. -->
<form action="/users" method="post">
  <input type="hidden" name="_method" value="put">
  <label for="user_email">Email</label>
  <input type="email" name="user[email]" id="user_email" value="alice@example.com" data-fx="email">
  <label for="user_password">Password</label> <i>(leave blank if you don't want to change it)</i>
  <input type="password" name="user[password]" id="user_password" data-fx="new">
  <label for="user_password_confirmation">Password confirmation</label>
  <input type="password" name="user[password_confirmation]" id="user_password_confirmation" data-fx="confirm">
  <label for="user_current_password">Current password</label> <i>(we need your current password to confirm your changes)</i>
  <input type="password" name="user[current_password]" id="user_current_password" data-fx="current">
  <input type="submit" value="Update">
</form>
