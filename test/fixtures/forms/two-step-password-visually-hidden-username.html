<!-- Second step of a two-step login that keeps the identifier in a visually hidden autocomplete="username"
     field (clipped to 1px) rather than [hidden]. The password field is real; the username is shown as text. -->
<form action="/signin/password" method="post">
  <p class="identity">alice@example.com</p>
  <input type="email" name="username" autocomplete="username" value="alice@example.com" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0)" data-fx="user">
  <input type="password" name="password" autocomplete="current-password" data-fx="pw">
  <button type="submit">Sign in</button>
</form>
