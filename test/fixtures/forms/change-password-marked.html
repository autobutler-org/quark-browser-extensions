<!-- Change-password form with a hidden username field and every password marked. -->
<form action="/settings/password" method="post">
  <input type="text" name="username" autocomplete="username" value="alice" hidden data-fx="user">
  <input type="password" name="old" autocomplete="current-password" data-fx="current">
  <input type="password" name="new" autocomplete="new-password" data-fx="new">
  <input type="password" name="confirm" autocomplete="new-password" data-fx="confirm">
  <button type="submit">Change password</button>
</form>
