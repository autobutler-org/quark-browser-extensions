<!-- Second step of a two-step login rendered without a <form>, below a site search box. -->
<div class="header"><input type="text" aria-label="Search" placeholder="Search help" data-fx="search"></div>
<div class="login-step">
  <div class="identity">alice@example.com</div>
  <input type="password" aria-label="Enter your password" data-fx="pw">
  <button type="button">Next</button>
</div>
