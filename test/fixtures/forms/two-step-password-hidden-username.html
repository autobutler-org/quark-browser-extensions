<!-- Second step of a two-step login: the identifier is kept in a hidden autocomplete="username"
     field, as browser vendors recommend, and shown as text. -->
<form action="/signin/password" method="post">
  <p class="identity">alice@example.com</p>
  <input type="email" name="username" autocomplete="username" value="alice@example.com" hidden data-fx="user">
  <input type="password" name="password" autocomplete="current-password" data-fx="pw">
  <button type="submit">Sign in</button>
</form>
