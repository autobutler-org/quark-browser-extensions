<!-- Enterprise web-mail style login: username, then a domain field, then password, unmarked. -->
<form action="/auth/owa" method="post">
  <label for="un">User name</label> <input id="un" name="username" type="text" data-fx="user">
  <label for="dom">Domain</label> <input id="dom" name="domain" type="text" value="CORP" data-fx="domain">
  <label for="pw">Password</label> <input id="pw" name="password" type="password" data-fx="pw">
  <input type="submit" value="Sign in">
</form>
