<!-- First step of a two-step login that keeps the password field in the form but hidden until "Next".
     Only the identifier is visible, so the email field is where the inline button goes. -->
<form action="/login" method="post">
  <label for="login-email">Email</label>
  <input type="email" id="login-email" name="loginfmt" data-fx="user">
  <div class="password-step" style="display: none">
    <input type="password" name="passwd" autocomplete="current-password" data-fx="pw">
  </div>
  <button type="submit">Next</button>
</form>
