<!-- Single-page app login rendered without a <form>; fields bound by the framework, no names. -->
<div id="app">
  <nav><input type="text" aria-label="Search docs" placeholder="Search docs" data-fx="search"></nav>
  <div class="card">
    <div class="field"><label>Email address</label><input type="email" aria-label="Email address" data-fx="user"></div>
    <div class="field"><label>Password</label><input type="password" aria-label="Password" data-fx="pw"></div>
    <button type="button" class="primary">Log in</button>
  </div>
</div>
