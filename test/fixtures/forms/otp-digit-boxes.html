<!-- Six single-digit boxes, each wrapped in its own cell, outside any <form>. -->
<div class="verify">
  <p>Enter the 6-digit code we texted you</p>
  <div class="otp-group">
    <div class="cell"><input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 1" data-fx="d1"></div>
    <div class="cell"><input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2" data-fx="d2"></div>
    <div class="cell"><input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3" data-fx="d3"></div>
    <div class="cell"><input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4" data-fx="d4"></div>
    <div class="cell"><input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5" data-fx="d5"></div>
    <div class="cell"><input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6" data-fx="d6"></div>
  </div>
  <button type="button">Verify</button>
</div>
