<!-- Quark's own web login, /login, as a Flutter web release build draws it at 1280×800 (#159). Saved from the

     Flutter's stylesheets left out. Flutter paints the whole app, fields included, into the <canvas> in the glass
     pane. The <input>s the user types into belong to the semantics tree laid over it, which Flutter makes
     invisible with filter: opacity(0%) on its root node: each input is fully transparent yet sits exactly on the
     field the canvas paints, and a click there reaches it. Nothing marks the fields but aria-label, and both say
     autocomplete="off". -->
