<!-- Three unmarked password fields whose names give nothing away: current, new, confirm by position. -->
<form action="/profile/pw" method="post">
  <input type="password" name="pw_a" data-fx="current">
  <input type="password" name="pw_b" data-fx="new">
  <input type="password" name="pw_c" data-fx="confirm">
  <button>Save</button>
</form>
