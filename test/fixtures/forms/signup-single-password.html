<!-- Sign-up with one new password and a show-password toggle. -->
<form action="/signup" method="post">
  <input type="email" name="email" autocomplete="email" data-fx="user">
  <input type="password" name="password" autocomplete="new-password" minlength="8" data-fx="pw">
  <button type="button" aria-label="Show password">Show</button>
  <button type="submit">Sign up</button>
</form>
