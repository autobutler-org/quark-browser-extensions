<!-- Sign-up with bracketed framework names: the first name must not pass for the username. -->
<form action="/users" method="post">
  <input type="text" name="user[first_name]" id="user_first_name" data-fx="first">
  <input type="email" name="user[email]" id="user_email" data-fx="email">
  <input type="text" name="user[last_name]" id="user_last_name" data-fx="last">
  <input type="password" name="user[password]" id="user_password" data-fx="pw">
  <input type="submit" value="Sign up">
</form>
