<!-- Second step of a two-step login that shows the identifier in a read-only field. -->
<form action="/idp/password" method="post">
  <input type="text" name="identifier" autocomplete="username" value="alice@example.com" readonly data-fx="user">
  <a href="/idp/identify">Not you?</a>
  <input type="password" name="credentials.passcode" autocomplete="current-password" data-fx="pw">
  <input type="submit" value="Verify">
</form>
