<!-- Change-password form named old/new/new-again with no autocomplete hints. -->
<form method="post" action="/password_change/">
  <input type="password" name="old_password" id="id_old_password" data-fx="current">
  <input type="password" name="new_password1" id="id_new_password1" data-fx="new">
  <input type="password" name="new_password2" id="id_new_password2" data-fx="confirm">
  <input type="submit" value="Change my password">
</form>
