# Runs the same ESLint as `npm run lint` on the staged files. It uses the
# repo's own node_modules, so run `npm ci` before `pre-commit install`.
repos:
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx --no-install eslint --max-warnings=0 --no-warn-ignored
        language: system
        types_or: [ts, javascript]
